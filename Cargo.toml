[package]
name = "hyper-service"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/HypeR-Proj/lib-service"
publish = false
description = "Typed service contracts for HypeR Native system applications"
workspace = "../../app"

[dependencies]

[dependencies.hyper-block]
workspace = true

[dependencies.hyper-os]
workspace = true

[dependencies.hyper-component]
workspace = true

[dependencies.hyper-service-ipc]
workspace = true

[dependencies.hyper-journal]
workspace = true

[dependencies.serde]
workspace = true
features = ["derive"]

[lints]

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(target_os, values(\"hyper\"))"]
